<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPear Fiction FrontEnd Assessment</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #222;
        font-family: Arial, sans-serif;
      }
      #app {
        width: 100vw;
        height: 100vh;
      }
      #info-btn {
        position: fixed;
        top: 20px;
        left: 20px;
        font-size: 24px;
        cursor: pointer;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.1);
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        color: white;
        transition: background 0.2s;
      }
      #info-btn:hover {
        background: rgba(255, 255, 255, 0.3);
      }
      #side-panel {
        position: fixed;
        top: 0;
        left: -320px;
        width: 320px;
        height: 100vh;
        background: #1a1a1a;
        color: white;
        transition: left 0.3s ease;
        z-index: 1001;
        box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        overflow-y: auto;
      }
      #side-panel.open {
        left: 0;
      }
      #close-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        font-size: 24px;
        cursor: pointer;
        user-select: none;
      }
      #close-btn:hover {
        color: #ff5555;
      }
      #side-panel h2 {
        text-align: center;
        margin-top: 20px;
        margin-bottom: 30px;
      }
      #paylines-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 30px;
        padding-bottom: 40px;
      }
      .payline-item {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .payline-title {
        margin-bottom: 10px;
        font-weight: bold;
        color: #ddd;
      }
      .payline-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 3px;
        width: 150px;
      }
      .grid-cell {
        aspect-ratio: 1;
        background: #333;
        border-radius: 2px;
      }
      .grid-cell.active {
        background: #ffd700;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="info-btn">ℹ</div>
    
    <div id="side-panel">
      <div id="close-btn">✖</div>
      <h2>Paylines</h2>
      <div id="paylines-container"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
